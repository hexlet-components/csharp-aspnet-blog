[tools]
betterleaks = "latest"
dotnet = "10"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
osv-scanner = "latest"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"


# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["dotnet restore --locked-mode", "hk install"]

[tasks.test]
description = "Тесты (xUnit на Microsoft.Testing.Platform)"
run = "dotnet test --no-restore"

[tasks.dev]
description = "Запустить приложение на http://localhost:5128"
run = "dotnet run --project src/CSharpAspNetBlog"

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
